# Render Blueprint — API only. Frontend is deployed on Vercel.
# Dashboard: New → Blueprint → this repo.

services:
  - type: web
    name: ultrix-leave-api
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=optional
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_LEAVE_CHANNEL
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: ATT4U_ENABLED
        value: "true"
      - key: ATT4U_SOAP_URL
        value: http://att4u.com/stan/WebApiService.asmx
      - key: ATT4U_USER
        value: Api
      - key: ATT4U_PASSWORD
        sync: false
      - key: ATT4U_SERIAL
        value: NFZ8245103695
      - key: ATT4U_PORTAL_URL
        value: http://www.att4u.com/STAN
      - key: ATT4U_PORTAL_USER
        value: essl
      - key: ATT4U_PORTAL_PASSWORD
        sync: false
      - key: ATT4U_LOOKBACK_DAYS
        value: "7"
      - key: ATT4U_POLL_MS
        value: "4000"
